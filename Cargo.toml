[workspace]
resolver = "3"
members = ["theterminal"]

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
smol = "2"
smol-macros = "0.1"
contemporary = { git = "https://github.com/vicr123/contemporary-rs" }
cntp_i18n = { git = "https://github.com/vicr123/contemporary-rs", features = ["gpui"] }
cntp_icon_tool_macros = { git = "https://github.com/vicr123/contemporary-rs" }
cntp_i18n_gen = { git = "https://github.com/vicr123/contemporary-rs" }
portable-pty = "0.9"
tracing = "0.1"
async-channel = "2"
vt100 = { git = "https://github.com/vicr123/vt100-rust.git", branch = "more-escape-codes" }
ini = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc2-open-directory = "0.3"
objc2-foundation = { version = "0.3", features = [
    "NSDictionary",
    "NSValue",
    "NSData",
] }